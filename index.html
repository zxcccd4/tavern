<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒馆 | 愚蠢</title>
    <style>
        /* 全局重置与背景图设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            /* 【重点 1】背景图设置：替换下面的 URL 为你喜欢的图片链接 */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
                url('bg.jpg') no-repeat center center/cover;
            overflow: hidden;
        }

        /* 磨砂玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-in-out;
        }

        /* 【重点 2】高级感动态流动渐变文字 */
        .glow-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #a1c4fd 50%, #c2e9fb 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            text-shadow: 0 0 20px rgba(161, 196, 253, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* 【重点 3】高级微光动效按钮 */
        .enter-btn {
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* 按钮悬浮光效 */
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.6);
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        .enter-btn:active {
            transform: translateY(-1px);
        }

        /* 动画定义 */
        @keyframes shine {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h1 class="glow-title"> 酒 馆</h1>
        <p class="subtitle">完全淫窟</p>

        <!-- 【重点 4】把下面的网址改成你的酒馆真实地址 -->
        <a href="https://jinshanapi.cc.cd" class="enter-btn">进入</a>
    </div>

</body>

</html>
