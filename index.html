<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f1013">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>SillyTavern</title>

    <style>
        /* ═══════════════════════════════════════════════════════
           【看门狗灰调极简质感 - 优化版】
        ═══════════════════════════════════════════════════════ */
        :root {
            --bg-base: #0f1013;
            --grey-box: #1c1f24;
            --grey-card: #232730;
            --grey-border: #353a45;
            --grey-border-light: #484f5e;
            --grey-sub: #868d9d;
            --text-white: #ffffff;
            --accent-cyan: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: var(--bg-base);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            position: relative;
            background: var(--bg-base);
        }

        /* ─── 监视器扫描线 ─── */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            opacity: 0.6;
        }

        /* ─── 背景呼吸动态特效 ─── */
        .ambient-breathing-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .breath-orb-1 {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(30, 35, 48, 0.3) 50%, transparent 75%);
            filter: blur(40px);
            will-change: transform, opacity;
            animation: breathePulse1 6s infinite ease-in-out;
        }

        .breath-orb-2 {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 420px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(80, 95, 125, 0.18) 0%, rgba(18, 20, 26, 0.4) 60%, transparent 80%);
            filter: blur(50px);
            will-change: transform, opacity;
            animation: breathePulse2 8s infinite ease-in-out;
        }

        .grid-texture {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            will-change: opacity;
            animation: gridBreathe 7s infinite ease-in-out;
        }

        /* ─── 手机端主容器 ─── */
        .app-shell {
            position: relative;
            z-index: 2;
            max-width: 460px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 16px;
            gap: 18px;
        }

        /* ─── 1. 顶部状态栏 ─── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            border-left: 3px solid var(--accent-cyan);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
            user-select: none;
        }

        .bar-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .bar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: monospace;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: dotBlink 1.8s infinite ease-in-out;
        }

        /* ─── 2. 核心图片展示模块 ─── */
        .image-container-module {
            position: relative;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            padding: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        .corner-mark {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 5;
        }
        .c-tl { top: -1px; left: -1px; border-top: 2px solid #fff; border-left: 2px solid #fff; }
        .c-tr { top: -1px; right: -1px; border-top: 2px solid #fff; border-right: 2px solid #fff; }
        .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid #fff; border-left: 2px solid #fff; }
        .c-br { bottom: -1px; right: -1px; border-bottom: 2px solid #fff; border-right: 2px solid #fff; }

        .image-aspect-box {
            position: relative;
            width: 100%;
            aspect-ratio: 900 / 696;
            background: #090a0c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ─── 3. 进入按钮 ─── */
        .enter-btn-wrapper {
            width: 100%;
        }

        .watchdogs-enter-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 56px;
            padding: 0 20px;
            background: var(--grey-card);
            border: 1px solid var(--grey-border-light);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            text-decoration: none;
            color: var(--text-white);
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .watchdogs-enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-cyan);
            transition: width 0.2s ease;
        }

        .watchdogs-enter-btn:hover {
            background: #2b313d;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .watchdogs-enter-btn:active {
            transform: scale(0.98);
            background: #353a45;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .watchdogs-enter-btn:hover::before {
            width: 8px;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
            text-transform: uppercase;
            z-index: 2;
        }

        .btn-arrow-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
            z-index: 2;
        }

        .watchdogs-enter-btn:hover .btn-arrow-box {
            transform: translateX(4px);
            background: #fff;
            color: #000;
        }

        .bottom-reserve-space {
            height: 20px;
        }

        /* ─── Keyframes ─── */
        @keyframes breathePulse1 {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.55;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.25);
                opacity: 0.85;
            }
        }

        @keyframes breathePulse2 {
            0%, 100% {
                transform: translate(-50%, 50%) scale(1.15);
                opacity: 0.7;
            }
            50% {
                transform: translate(-50%, 50%) scale(0.9);
                opacity: 0.3;
            }
        }

        @keyframes gridBreathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>
    <!-- 监视器扫描线 -->
    <div class="scanlines"></div>

    <!-- 呼吸感动态背景层 -->
    <div class="ambient-breathing-layer">
        <div class="breath-orb-1"></div>
        <div class="breath-orb-2"></div>
        <div class="grid-texture"></div>
    </div>

    <!-- 手机端主内容 -->
    <div class="app-shell">

        <!-- 顶部简洁条 -->
        <div class="top-bar">
            <span class="bar-title">TAVERN</span>
            <div class="bar-status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <!-- 核心图片展示 (900x696 比例) -->
        <div class="image-container-module">
            <div class="corner-mark c-tl"></div>
            <div class="corner-mark c-tr"></div>
            <div class="corner-mark c-bl"></div>
            <div class="corner-mark c-br"></div>

            <div class="image-aspect-box">
                <img src="3zhuye.jpg" alt="SillyTavern" class="main-character-img" loading="eager">
            </div>
        </div>

        <!-- 核心进入按钮 -->
        <div class="enter-btn-wrapper">
            <a href="https://tavern.jinshanapi.cc.cd" class="watchdogs-enter-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-text">SillyTavern</span>
                <div class="btn-arrow-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <div class="bottom-reserve-space"></div>

    </div>
</body>

</html>
</html>
