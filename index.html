<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 
    <title>SillyTavern</title>

    <style>
        /* ═══════════════════════════════════════════════════════
           【看门狗灰调极简质感】
        ═══════════════════════════════════════════════════════ */
        :root {
            --bg-base: #0f1013;
            --grey-box: #1c1f24;
            --grey-card: #232730;
            --grey-border: #353a45;
            --grey-border-light: #484f5e;
            --grey-sub: #868d9d;
            --text-white: #ffffff;
            --accent-cyan: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: var(--bg-base);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            position: relative;
            background: var(--bg-base);
        }

        /* ═══════════════════════════════════════════════════════
           【监视器全屏扫描线 (覆盖所有图层与图片，一条一条灰色条纹)】
        ═══════════════════════════════════════════════════════ */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            /* 细密一条一条的纯正监视器扫描线 */
            background: linear-gradient(
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.4) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            opacity: 0.75;
        }

        /* ═══════════════════════════════════════════════════════
           【背景呼吸动态特效 (BREATHING AMBIENT)】
        ═══════════════════════════════════════════════════════ */
        .ambient-breathing-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        /* 呼吸光团 1：深灰偏青冷光，缓缓冲盈呼吸 */
        .breath-orb-1 {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(30, 35, 48, 0.45) 50%, transparent 75%);
            filter: blur(60px);
            animation: breathePulse1 6s infinite ease-in-out;
        }

        /* 呼吸光团 2：深炭灰暖光，在下方反相律动 */
        .breath-orb-2 {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 420px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(80, 95, 125, 0.22) 0%, rgba(18, 20, 26, 0.5) 60%, transparent 80%);
            filter: blur(70px);
            animation: breathePulse2 8s infinite ease-in-out;
        }

        /* 细密微点网格纹理 + 呼吸明暗调节 */
        .grid-texture {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridBreathe 7s infinite ease-in-out;
        }

        /* ═══════════════════════════════════════════════════════
           【手机端主容器 (SHELL)】
        ═══════════════════════════════════════════════════════ */
        .app-shell {
            position: relative;
            z-index: 2;
            max-width: 460px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 16px;
            gap: 18px;
        }

        /* ─── 1. 顶部简洁状态栏 ─── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            border-left: 3px solid var(--accent-cyan);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        .bar-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .bar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: monospace;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: dotBlink 1.8s infinite ease-in-out;
        }

        /* ─── 2. 核心展示区域：严格契合 900x696 图片的看门狗战术框 ─── */
        .image-container-module {
            position: relative;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            padding: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        /* 四角战术切角瞄准标 [+] */
        .corner-mark {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 5;
        }
        .c-tl { top: -1px; left: -1px; border-top: 2px solid #fff; border-left: 2px solid #fff; }
        .c-tr { top: -1px; right: -1px; border-top: 2px solid #fff; border-right: 2px solid #fff; }
        .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid #fff; border-left: 2px solid #fff; }
        .c-br { bottom: -1px; right: -1px; border-bottom: 2px solid #fff; border-right: 2px solid #fff; }

        /* 900 / 696 比例画框，手机上完美适配，绝对不拉伸 */
        .image-aspect-box {
            position: relative;
            width: 100%;
            aspect-ratio: 900 / 696;
            background: #090a0c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ─── 3. 进入按钮：纯粹简洁的 SillyTavern 战术切角按钮 ─── */
        .enter-btn-wrapper {
            width: 100%;
        }

        .watchdogs-enter-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 56px;
            padding: 0 20px;
            background: var(--grey-card);
            border: 1px solid var(--grey-border-light);
            /* 看门狗经典不对称硬朗切角 */
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            text-decoration: none;
            color: var(--text-white);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .watchdogs-enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-cyan);
            transition: width 0.25s ease;
        }

        .watchdogs-enter-btn:hover,
        .watchdogs-enter-btn:active {
            background: #2b313d;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .watchdogs-enter-btn:hover::before {
            width: 8px;
        }

        /* 纯粹的英文名展示 */
        .btn-text {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
            text-transform: uppercase;
            z-index: 2;
        }

        .btn-arrow-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
            z-index: 2;
        }

        .watchdogs-enter-btn:hover .btn-arrow-box {
            transform: translateX(4px);
            background: #fff;
            color: #000;
        }

        /* ─── 4. 下滑预留空隙 ─── */
        .bottom-reserve-space {
            height: 40px;
        }

        /* ═══════════════════════════════════════════════════════
           【呼吸动画 KEYFRAMES】
        ═══════════════════════════════════════════════════════ */
        @keyframes breathePulse1 {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.55;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.35);
                opacity: 0.95;
            }
        }

        @keyframes breathePulse2 {
            0%, 100% {
                transform: translate(-50%, 50%) scale(1.2);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, 50%) scale(0.85);
                opacity: 0.35;
            }
        }

        @keyframes gridBreathe {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.75; }
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>
    <!-- 监视器扫描线 (覆盖在最顶层 z-index: 999，使包括图片和按钮都有一条一条看门狗条纹质感) -->
    <div class="scanlines"></div>

    <!-- 呼吸感动态背景层 -->
    <div class="ambient-breathing-layer">
        <div class="breath-orb-1"></div>
        <div class="breath-orb-2"></div>
        <div class="grid-texture"></div>
    </div>

    <!-- 手机端主内容 -->
    <div class="app-shell">

        <!-- 顶部简洁条 -->
        <div class="top-bar">
            <!-- 📌【修改标题可在此修改】 -->
            <span class="bar-title">TAVERN</span>
            <div class="bar-status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <!-- 核心图片展示 (900x696 比例) -->
        <div class="image-container-module">
            <div class="corner-mark c-tl"></div>
            <div class="corner-mark c-tr"></div>
            <div class="corner-mark c-bl"></div>
            <div class="corner-mark c-br"></div>

            <div class="image-aspect-box">
                <!-- 
                   📌【主图：3zhuye.jpg】
                   图片和 index.html 一起上传到 GitHub 
                -->
                <img src="3zhuye.jpg" alt="SillyTavern" class="main-character-img" onerror="this.src='3zhuye.jpg'">
            </div>
        </div>

        <!-- 核心进入按钮：SillyTavern -->
        <div class="enter-btn-wrapper">
            <!-- 
               ════════════════════════════════════════════════════
               📌【修改酒馆地址】
               ════════════════════════════════════════════════════
            -->
            <a href="https://tavern.jinshanapi.cc.cd" class="watchdogs-enter-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-text">SillyTavern</span>
                <div class="btn-arrow-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <!-- 往下拉预留空间 (先留着) -->
        <div class="bottom-reserve-space"></div>

    </div>
</body>

</html>
