<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SillyTavern</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0f1013;
            --grey-box: #1c1f24;
            --grey-card: #232730;
            --grey-border: #353a45;
            --grey-border-light: #484f5e;
            --grey-sub: #868d9d;
            --text-white: #ffffff;
            --accent-cyan: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 📌【第一层：字符动画封面遮罩（去除了文字提示）】 */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #introCanvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        /* 点击淡出 */
        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 📌【第二层：主界面内容】 */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.4) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            opacity: 0.75;
        }

        .ambient-breathing-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .breath-orb-1 {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.14) 0%, rgba(30, 35, 48, 0.45) 50%, transparent 75%);
            filter: blur(60px);
            animation: breathePulse1 6s infinite ease-in-out;
        }

        .breath-orb-2 {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 420px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(80, 95, 125, 0.22) 0%, rgba(18, 20, 26, 0.5) 60%, transparent 80%);
            filter: blur(70px);
            animation: breathePulse2 8s infinite ease-in-out;
        }

        .grid-texture {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridBreathe 7s infinite ease-in-out;
        }

        .app-shell {
            position: relative;
            z-index: 2;
            max-width: 460px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 16px;
            gap: 18px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            border-left: 3px solid var(--accent-cyan);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        .bar-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .bar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: monospace;
            color: var(--accent-cyan);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: dotBlink 1.8s infinite ease-in-out;
        }

        .image-container-module {
            position: relative;
            background: var(--grey-box);
            border: 1px solid var(--grey-border);
            padding: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        .corner-mark {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 5;
        }
        .c-tl { top: -1px; left: -1px; border-top: 2px solid #fff; border-left: 2px solid #fff; }
        .c-tr { top: -1px; right: -1px; border-top: 2px solid #fff; border-right: 2px solid #fff; }
        .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid #fff; border-left: 2px solid #fff; }
        .c-br { bottom: -1px; right: -1px; border-bottom: 2px solid #fff; border-right: 2px solid #fff; }

        .image-aspect-box {
            position: relative;
            width: 100%;
            aspect-ratio: 900 / 696;
            background: #090a0c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .enter-btn-wrapper {
            width: 100%;
        }

        .watchdogs-enter-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 56px;
            padding: 0 20px;
            background: var(--grey-card);
            border: 1px solid var(--grey-border-light);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            text-decoration: none;
            color: var(--text-white);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .watchdogs-enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-cyan);
            transition: width 0.25s ease;
        }

        .watchdogs-enter-btn:hover,
        .watchdogs-enter-btn:active {
            background: #2b313d;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .watchdogs-enter-btn:hover::before {
            width: 8px;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-white);
            text-transform: uppercase;
            z-index: 2;
        }

        .btn-arrow-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
            z-index: 2;
        }

        .watchdogs-enter-btn:hover .btn-arrow-box {
            transform: translateX(4px);
            background: #fff;
            color: #000;
        }

        .bottom-reserve-space {
            height: 40px;
        }

        @keyframes breathePulse1 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.55; }
            50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.95; }
        }

        @keyframes breathePulse2 {
            0%, 100% { transform: translate(-50%, 50%) scale(1.2); opacity: 0.8; }
            50% { transform: translate(-50%, 50%) scale(0.85); opacity: 0.35; }
        }

        @keyframes gridBreathe {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.75; }
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>

<body>
    <!-- 📌 修改这里的 src 路径为你导出的视频名称（例如 my_video.webm） -->
    <video id="sourceVideo" src="my_video.webm" loop muted playsinline></video>

    <!-- 第一层：遮罩纯展示字符，无提示字 -->
    <div id="intro-overlay">
        <canvas id="introCanvas"></canvas>
    </div>

    <!-- 第二层：主界面 -->
    <div class="scanlines"></div>

    <div class="ambient-breathing-layer">
        <div class="breath-orb-1"></div>
        <div class="breath-orb-2"></div>
        <div class="grid-texture"></div>
    </div>

    <div class="app-shell">
        <div class="top-bar">
            <span class="bar-title">TAVERN</span>
            <div class="bar-status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <div class="image-container-module">
            <div class="corner-mark c-tl"></div>
            <div class="corner-mark c-tr"></div>
            <div class="corner-mark c-bl"></div>
            <div class="corner-mark c-br"></div>

            <div class="image-aspect-box">
                <img src="3zhuye.jpg" alt="SillyTavern" class="main-character-img" onerror="this.src='3zhuye.jpg'">
            </div>
        </div>

        <div class="enter-btn-wrapper">
            <a href="https://tavern.jinshanapi.cc.cd" class="watchdogs-enter-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-text">SillyTavern</span>
                <div class="btn-arrow-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <div class="bottom-reserve-space"></div>
    </div>

    <script>
        const CONFIG = {
            mainChars: ['b', 'g', 'n', 'i'],
            arrows: ['→', '↓', '←', '↑'],
            targetCols: 130,
            fontAspectRatio: 0.58,
            lineHeightRatio: 0.85,
            textColor: '#000000',
            arrowColor: '#000000',
            bgColor: '#ffffff',
            darkThreshold: 135
        };

        const video = document.getElementById('sourceVideo');
        const introCanvas = document.getElementById('introCanvas');
        const ctx = introCanvas.getContext('2d');

        const sampleCanvas = document.createElement('canvas');
        const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
        const simplex = new SimplexNoise();

        let fontSize = 16, charWidth = 0, lineHeight = 0;
        let cols = 0, rows = 0, time = 0;
        let isAnimationActive = true;

        function resize() {
            introCanvas.width = window.innerWidth;
            introCanvas.height = window.innerHeight;

            charWidth = introCanvas.width / CONFIG.targetCols;
            fontSize = Math.floor(charWidth / CONFIG.fontAspectRatio);
            lineHeight = fontSize * CONFIG.lineHeightRatio;

            cols = CONFIG.targetCols;
            rows = Math.floor(introCanvas.height / lineHeight) || 1;

            sampleCanvas.width = cols;
            sampleCanvas.height = rows;
        }

        function renderFrame() {
            if (!isAnimationActive) return;
            requestAnimationFrame(renderFrame);

            if (video.paused || video.ended || video.readyState < 2 || cols === 0 || rows === 0) return;

            sampleCtx.drawImage(video, 0, 0, cols, rows);
            const imgData = sampleCtx.getImageData(0, 0, cols, rows).data;

            ctx.fillStyle = CONFIG.bgColor;
            ctx.fillRect(0, 0, introCanvas.width, introCanvas.height);

            ctx.font = `400 ${fontSize}px "Space Mono", monospace`;
            ctx.textBaseline = 'top';

            time += 0.0012;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const index = (y * cols + x) * 4;
                    if (index + 2 >= imgData.length) continue;

                    const brightness = imgData[index] * 0.299 + imgData[index + 1] * 0.587 + imgData[index + 2] * 0.114;
                    const drawX = x * charWidth;
                    const drawY = y * lineHeight;

                    if (brightness < CONFIG.darkThreshold) {
                        const charIdx = Math.floor((brightness / CONFIG.darkThreshold) * (CONFIG.mainChars.length - 1));
                        ctx.fillStyle = CONFIG.textColor;
                        ctx.fillText(CONFIG.mainChars[charIdx], drawX, drawY);
                    } else {
                        const noiseVal = simplex.noise3D(x * 0.018, y * 0.018, time);
                        let arrowIdx = Math.floor(((noiseVal + 1) / 2) * CONFIG.arrows.length);
                        arrowIdx = Math.max(0, Math.min(arrowIdx, CONFIG.arrows.length - 1));

                        ctx.fillStyle = CONFIG.arrowColor;
                        ctx.fillText(CONFIG.arrows[arrowIdx], drawX, drawY);
                    }
                }
            }
        }

        window.addEventListener('resize', resize);
        video.addEventListener('loadedmetadata', resize);
        video.addEventListener('play', () => {
            resize();
            requestAnimationFrame(renderFrame);
        });

        resize();
        video.play().catch(() => { });

        // 点击页面任意地方淡出
        const overlay = document.getElementById('intro-overlay');
        overlay.addEventListener('click', () => {
            overlay.classList.add('fade-out');
            setTimeout(() => {
                isAnimationActive = false;
                video.pause();
            }, 800);
        });
    </script>
</body>

</html>
